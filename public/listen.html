<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ONEseason 음악 · 채팅</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#383363,#101527 70%);color:#f9f7ff;font-family:system-ui,sans-serif;min-height:100dvh}.wrap{width:min(100%,600px);margin:auto;padding:24px 16px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}.count{color:#c9f3df;font-size:14px}p{color:#c7c9df;font-size:14px}.card{background:#252a46;border:1px solid #7775a4;border-radius:18px;padding:16px;margin-top:14px}input,button{font:inherit;border-radius:12px;padding:12px;border:1px solid #787aab}input{background:#151c32;color:white;min-width:0}button{background:#9a70df;color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.5}#entry{display:flex;gap:8px}#entry input{flex:1}#room[hidden],#entry[hidden]{display:none}#player{width:100%;aspect-ratio:16/9;background:#0a0c16;border:0;border-radius:12px}#song{font-weight:800;margin:12px 0 5px}#notice{font-size:12px;color:#dcd3f4}#chat{height:clamp(190px,36dvh,360px);overflow-y:auto;padding:8px;background:#151a30;border-radius:12px;overflow-wrap:anywhere}.line{margin:5px 0;font-size:14px}.line b{color:#d0b5ff;margin-right:6px}form{display:flex;gap:8px;margin-top:10px}form input{flex:1}a{display:block;text-align:center;margin-top:20px;color:#d1c4ec}#status{min-height:20px;color:#ffc6bb;font-size:13px}.music-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.music-actions input{flex:1;min-width:120px}.music-list{display:grid;gap:6px}.track-row{display:flex;gap:8px;align-items:center;background:#171d34;padding:8px;border-radius:10px}.track-row span{flex:1;font-size:13px;overflow-wrap:anywhere}.track-row button{padding:7px;font-size:12px}.music-status{font-size:13px;color:#e1caff;min-height:18px}#voteBox[hidden]{display:none}input{font-size:16px}</style></head><body><main class="wrap"><header><h1>🎧 ONEseason</h1><div style="display:flex;gap:6px;align-items:center"><button class="count" id="count" type="button" aria-expanded="false">접속자 확인 중</button><button type="button" id="musicMenuToggle" aria-expanded="false" aria-controls="musicMenu" style="font-size:13px;padding:10px">🎵 음악 메뉴</button></div></header><p>페스티벌에서 흐르는 음악과 채팅을 함께 즐겨요.</p><section class="card" id="peoplePanel" hidden><b>접속자 목록</b><div id="peopleList"></div></section><div class="card" id="entry"><input id="nickname" maxlength="18" placeholder="닉네임을 입력해 주세요" aria-label="닉네임"><button id="join">입장하기</button></div><div id="room" hidden><section class="card"><div id="player"></div><button type="button" id="sound" aria-pressed="true">🔊 소리 켜짐</button><div id="song">음악을 기다리고 있어요</div><div id="notice">음악이 안 들리면 영상의 재생 버튼을 눌러주세요.</div></section><section class="card" id="musicMenu" hidden><h2 style="font-size:17px;margin:0">🎵 음악 예약</h2><div class="music-actions"><input id="searchInput" placeholder="곡명 또는 아티스트 검색"><button type="button" id="searchButton">검색</button></div><div id="searchStatus" class="music-status"></div><div id="searchResults" class="music-list"></div><div class="music-actions"><input id="videoUrl" placeholder="유튜브 링크로 예약"><button type="button" id="queueLink">링크 예약</button></div><label><input type="checkbox" id="liveToggle"> 라이브 영상</label><div class="music-actions"><button type="button" id="nextSong">⏭ 다음 곡</button></div><div id="musicStatus" class="music-status"></div><div id="voteBox" hidden><b id="voteText"></b><div class="music-actions"><button type="button" id="voteYes">찬성</button><button type="button" id="voteNo">반대</button></div></div><h3>예약 목록</h3><div id="queueList" class="music-list"></div><h3>이전 재생곡</h3><div id="historyList" class="music-list"></div></section><section class="card"><h2 style="font-size:17px;margin:0 0 10px">💬 실시간 채팅</h2><div id="chat" aria-live="polite"></div><form id="form"><input id="message" maxlength="80" placeholder="메시지를 입력하세요" autocomplete="off"><button>전송</button></form><div id="status"></div></section></div><a href="/">페스티벌로 이동</a></main><script src="https://www.youtube.com/iframe_api"></script><script>
const el=id=>document.getElementById(id);let id='',source=null,player=null,ready=false,music=null,delta=0,activeVideo='',joining=false,soundOn=true,people=[],queue=[],history=[],vote=null,lastDurationToken=null;const sessionKey=crypto.randomUUID().replaceAll('-','')+crypto.randomUUID().replaceAll('-',''),pageId=crypto.randomUUID().replaceAll('-','');
async function post(endpoint,data){const r=await fetch('/api/'+endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||'연결에 실패했어요.');return d}
function appendChat(item){if(!item)return;const row=document.createElement('div'),name=document.createElement('b'),msg=document.createElement('span');row.className='line';name.textContent=(item.name||'알림')+' :';msg.textContent=item.message||'';row.append(name,msg);el('chat').append(row);while(el('chat').children.length>100)el('chat').firstChild.remove();el('chat').scrollTop=el('chat').scrollHeight}
function syncMusic(m,serverNow){if(!m)return;music=m;if(serverNow)delta=serverNow-Date.now();el('song').textContent=m.title||'현재 재생 중인 음악이 없어요';if(!ready)return;if(soundOn)player.unMute();else player.mute();if(!m.id){player.stopVideo();activeVideo='';return}const pos=m.paused?Math.max(0,Number(m.position)||0):Math.max(0,(Date.now()+delta-(Number(m.startedAt)||Date.now()))/1000);if(activeVideo!==m.id){activeVideo=m.id;player.loadVideoById({videoId:m.id,startSeconds:m.isLive?0:pos});if(m.paused)player.pauseVideo();}else if(m.paused)player.pauseVideo();else{if(!m.isLive&&Math.abs(player.getCurrentTime()-pos)>3)player.seekTo(pos,true);player.playVideo()}}
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('player',{height:'100%',width:'100%',playerVars:{playsinline:1,rel:0},events:{onReady:()=>{ready=true;if(music)syncMusic(music)},onStateChange:e=>{if(!music?.id)return;if(e.data===YT.PlayerState.PLAYING&&lastDurationToken!==music.token){const duration=player.getDuration();if(duration>0&&!music.isLive){lastDurationToken=music.token;void musicCommand('duration',{token:music.token,duration},true)}}if(e.data===YT.PlayerState.ENDED)void musicCommand('ended',{token:music.token},true)}}})};
function showPeople(){const list=el('peopleList');list.replaceChildren();for(const person of people){const row=document.createElement('div');row.style.cssText='padding:6px 0';row.textContent=(person.listenerOnly?'🎧 ':'🎮 ')+(person.name||'ROCKER')+(person.id===id?' (나)':'')+(person.listenerOnly?' · 채팅방':' · 페스티벌');list.append(row)}if(!people.length)list.textContent='접속자가 없습니다.'}
el('musicMenuToggle').onclick=()=>{if(!id){el('status').textContent='입장 후 사용할 수 있어요.';el('nickname').focus();return}const menu=el('musicMenu');menu.hidden=!menu.hidden;el('musicMenuToggle').setAttribute('aria-expanded',String(!menu.hidden));};
el('count').onclick=()=>{const panel=el('peoplePanel');panel.hidden=!panel.hidden;el('count').setAttribute('aria-expanded',String(!panel.hidden));showPeople()};
el('sound').onclick=()=>{soundOn=!soundOn;el('sound').textContent=soundOn?'🔊 소리 켜짐':'🔇 소리 꺼짐';el('sound').setAttribute('aria-pressed',String(soundOn));if(ready){if(soundOn){player.unMute();if(music&&!music.paused)syncMusic(music)}else player.mute()}};
function renderTracks(){for(const [key,items] of [['queue',queue],['history',history]]){const list=el(key+'List');list.replaceChildren();if(!items.length){list.textContent=key==='queue'?'예약된 곡이 없습니다.':'이전 재생곡이 없습니다.';continue}items.forEach((track,index)=>{const row=document.createElement('div'),name=document.createElement('span'),button=document.createElement('button');row.className='track-row';name.textContent=(track.isLive?'🔴 LIVE · ':'')+(track.title||'제목 없음')+(track.addedBy?' · '+track.addedBy:'');button.textContent='선택 투표';button.type='button';button.onclick=()=>musicCommand('vote-select',{source:key,index,videoId:track.id});row.append(name,button);list.append(row)})}}
function renderVote(){el('voteBox').hidden=!vote;if(!vote)return;el('voteText').textContent=(vote.proposer||'')+'님의 곡 선택 투표 · '+(vote.target?.title||'')+' · 찬성 '+vote.yes+' / '+vote.required;const can=(vote.eligible||[]).includes(id)&&!(vote.voted||[]).includes(id);el('voteYes').disabled=!can;el('voteNo').disabled=!can}
function updateMusicData(d){if(Array.isArray(d.queue))queue=d.queue;if(Array.isArray(d.history))history=d.history;if(d.music)syncMusic(d.music,d.serverNow);renderTracks()}
async function musicCommand(command,extra={},silent=false){try{const d=await post('music',{id,command,...extra});updateMusicData(d);if(!silent)el('musicStatus').textContent=command==='enqueue'?'음악을 예약했어요.':'음악 요청을 처리했어요.';return d}catch(e){if(!silent)el('musicStatus').textContent=e.message;return null}}
el('nextSong').onclick=()=>musicCommand('skip');el('voteYes').onclick=()=>vote&&musicCommand('vote-cast',{voteId:vote.id,choice:'yes'});el('voteNo').onclick=()=>vote&&musicCommand('vote-cast',{voteId:vote.id,choice:'no'});
el('queueLink').onclick=async()=>{const input=el('videoUrl');if(!input.value.trim())return;const result=await musicCommand('enqueue',{url:input.value.trim(),isLive:el('liveToggle').checked});if(result)input.value=''};
async function searchMusic(){const input=el('searchInput'),q=input.value.trim(),status=el('searchStatus'),results=el('searchResults');if(q.length<2){status.textContent='두 글자 이상 입력해 주세요.';return}el('searchButton').disabled=true;status.textContent='검색 중…';results.replaceChildren();try{const response=await fetch('/api/youtube-search?'+new URLSearchParams({id,q}),{cache:'no-store'}),data=await response.json();if(!response.ok)throw Error(data.error||'검색할 수 없어요.');const items=Array.isArray(data.items)?data.items:[];status.textContent=items.length?items.length+'개의 검색 결과':'검색 결과가 없습니다.';for(const item of items){const row=document.createElement('div'),name=document.createElement('span'),button=document.createElement('button');row.className='track-row';name.textContent=(item.isLive?'🔴 LIVE · ':'')+item.title+' · '+(item.channel||'');button.textContent='예약';button.type='button';button.onclick=async()=>{button.disabled=true;const done=await musicCommand('enqueue',{url:'https://www.youtube.com/watch?v='+item.id,isLive:item.isLive===true});button.textContent=done?'예약 완료':'예약';button.disabled=!!done};row.append(name,button);results.append(row)}}catch(e){status.textContent=e.message}finally{el('searchButton').disabled=false}}
el('searchButton').onclick=searchMusic;el('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchMusic()}});
function eventHandler(d){if(d.type==='snapshot')people=d.onlinePeople||[];else if(d.type==='online-people')people=d.people||[];if(d.type==='snapshot'||d.type==='online-people')showPeople();if(d.count!==undefined)el('count').textContent='접속자 '+d.count+'명';if(d.type==='snapshot'){el('chat').replaceChildren();(d.chat||[]).forEach(appendChat);updateMusicData(d);vote=d.skipVote||null;renderVote()}else if(d.type==='chat')appendChat(d.entry);else if(d.type==='music')updateMusicData(d);else if(d.type==='skip-vote'){vote=d.vote||null;if(vote){el('musicMenu').hidden=false;el('musicMenuToggle').setAttribute('aria-expanded','true')}renderVote()}else if(d.type==='skip-vote-result'){el('musicStatus').textContent=d.passed?'투표가 통과됐어요.':'투표가 종료됐어요.'}}
function connect(){if(source)source.close();source=new EventSource('/api/events?id='+encodeURIComponent(id));source.onmessage=e=>{try{eventHandler(JSON.parse(e.data))}catch(err){console.warn(err)}};source.onerror=()=>{el('status').textContent='서버 연결을 다시 확인하고 있어요.'};source.onopen=()=>{el('status').textContent=''}}
async function enter(){if(joining)return;const name=el('nickname').value.trim();if(!name){el('nickname').focus();return}joining=true;el('join').disabled=true;el('join').textContent='연결 중…';try{const data=await post('join',{name,listenerOnly:true,sessionKey,pageId});id=data.id;el('entry').hidden=true;el('room').hidden=false;eventHandler({...data,type:'snapshot'});connect();if(ready&&music)syncMusic(music)}catch(e){alert(e.message||'연결하지 못했어요.')}finally{joining=false;el('join').disabled=false;el('join').textContent='입장하기'}}
el('join').onclick=enter;el('nickname').addEventListener('keydown',e=>{if(e.key==='Enter')enter()});el('form').onsubmit=async e=>{e.preventDefault();const input=el('message'),message=input.value.trim();if(!message||!id)return;try{await post('chat',{id,message});input.value='';el('status').textContent=''}catch(err){el('status').textContent=err.message}};
setInterval(()=>{if(id)post('heartbeat',{id}).catch(()=>{el('status').textContent='연결이 끊겼어요. 새로고침 후 다시 입장해 주세요.'})},18000);setInterval(()=>{if(music&&ready&&!music.paused)syncMusic(music)},15000);window.addEventListener('pagehide',()=>{if(id)navigator.sendBeacon('/api/leave',new Blob([JSON.stringify({id,pageId})],{type:'application/json'}))});
</script></body></html>
