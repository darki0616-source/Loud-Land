<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ONEseason 음악 · 채팅</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#383363,#101527 70%);color:#f9f7ff;font-family:system-ui,sans-serif;min-height:100dvh}.wrap{width:min(100%,600px);margin:auto;padding:24px 16px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}.count{color:#c9f3df;font-size:14px}p{color:#c7c9df;font-size:14px}.card{background:#252a46;border:1px solid #7775a4;border-radius:18px;padding:16px;margin-top:14px}input,button{font:inherit;border-radius:12px;padding:12px;border:1px solid #787aab}input{background:#151c32;color:white;min-width:0}button{background:#9a70df;color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.5}#entry{display:flex;gap:8px}#entry input{flex:1}#room[hidden],#entry[hidden]{display:none}#player{width:100%;aspect-ratio:16/9;background:#0a0c16;border:0;border-radius:12px}#song{font-weight:800;margin:12px 0 5px}#notice{font-size:12px;color:#dcd3f4}#chat{height:clamp(190px,36dvh,360px);overflow-y:auto;padding:8px;background:#151a30;border-radius:12px;overflow-wrap:anywhere}.line{margin:5px 0;font-size:14px}.line b{color:#d0b5ff;margin-right:6px}form{display:flex;gap:8px;margin-top:10px}form input{flex:1}a{display:block;text-align:center;margin-top:20px;color:#d1c4ec}#status{min-height:20px;color:#ffc6bb;font-size:13px}</style></head><body><main class="wrap"><header><h1>🎧 ONEseason</h1><span class="count" id="count">접속자 확인 중</span></header><p>페스티벌에서 흐르는 음악과 채팅을 함께 즐겨요.</p><div class="card" id="entry"><input id="nickname" maxlength="18" placeholder="닉네임을 입력해 주세요" aria-label="닉네임"><button id="join">입장하기</button></div><div id="room" hidden><section class="card"><div id="player"></div><div id="song">음악을 기다리고 있어요</div><div id="notice">음악이 안 들리면 영상의 재생 버튼을 눌러주세요.</div></section><section class="card"><h2 style="font-size:17px;margin:0 0 10px">💬 실시간 채팅</h2><div id="chat" aria-live="polite"></div><form id="form"><input id="message" maxlength="80" placeholder="메시지를 입력하세요" autocomplete="off"><button>전송</button></form><div id="status"></div></section></div><a href="/">페스티벌로 이동</a></main><script src="https://www.youtube.com/iframe_api"></script><script>
const el=id=>document.getElementById(id);let id='',source=null,player=null,ready=false,music=null,delta=0,activeVideo='',joining=false;const sessionKey=crypto.randomUUID().replaceAll('-','')+crypto.randomUUID().replaceAll('-',''),pageId=crypto.randomUUID().replaceAll('-','');
async function post(endpoint,data){const r=await fetch('/api/'+endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||'연결에 실패했어요.');return d}
function appendChat(item){if(!item)return;const row=document.createElement('div'),name=document.createElement('b'),msg=document.createElement('span');row.className='line';name.textContent=(item.name||'알림')+' :';msg.textContent=item.message||'';row.append(name,msg);el('chat').append(row);while(el('chat').children.length>100)el('chat').firstChild.remove();el('chat').scrollTop=el('chat').scrollHeight}
function syncMusic(m,serverNow){if(!m)return;music=m;if(serverNow)delta=serverNow-Date.now();el('song').textContent=m.title||'현재 재생 중인 음악이 없어요';if(!ready)return;if(!m.id){player.stopVideo();activeVideo='';return}const pos=m.paused?Math.max(0,Number(m.position)||0):Math.max(0,(Date.now()+delta-(Number(m.startedAt)||Date.now()))/1000);if(activeVideo!==m.id){activeVideo=m.id;player.loadVideoById({videoId:m.id,startSeconds:m.isLive?0:pos});if(m.paused)player.pauseVideo();}else if(m.paused)player.pauseVideo();else{if(!m.isLive&&Math.abs(player.getCurrentTime()-pos)>3)player.seekTo(pos,true);player.playVideo()}}
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('player',{height:'100%',width:'100%',playerVars:{playsinline:1,rel:0},events:{onReady:()=>{ready=true;if(music)syncMusic(music)}}})};
function eventHandler(d){if(d.count!==undefined)el('count').textContent='접속자 '+d.count+'명';if(d.type==='snapshot'){el('chat').replaceChildren();(d.chat||[]).forEach(appendChat);syncMusic(d.music,d.serverNow)}else if(d.type==='chat')appendChat(d.entry);else if(d.type==='music')syncMusic(d.music,d.serverNow)}
function connect(){if(source)source.close();source=new EventSource('/api/events?id='+encodeURIComponent(id));source.onmessage=e=>{try{eventHandler(JSON.parse(e.data))}catch(err){console.warn(err)}};source.onerror=()=>{el('status').textContent='서버 연결을 다시 확인하고 있어요.'};source.onopen=()=>{el('status').textContent=''}}
async function enter(){if(joining)return;const name=el('nickname').value.trim();if(!name){el('nickname').focus();return}joining=true;el('join').disabled=true;el('join').textContent='연결 중…';try{const data=await post('join',{name,listenerOnly:true,sessionKey,pageId});id=data.id;el('entry').hidden=true;el('room').hidden=false;eventHandler({...data,type:'snapshot'});connect();if(ready&&music)syncMusic(music)}catch(e){alert(e.message||'연결하지 못했어요.')}finally{joining=false;el('join').disabled=false;el('join').textContent='입장하기'}}
el('join').onclick=enter;el('nickname').addEventListener('keydown',e=>{if(e.key==='Enter')enter()});el('form').onsubmit=async e=>{e.preventDefault();const input=el('message'),message=input.value.trim();if(!message||!id)return;try{await post('chat',{id,message});input.value='';el('status').textContent=''}catch(err){el('status').textContent=err.message}};
setInterval(()=>{if(id)post('heartbeat',{id}).catch(()=>{el('status').textContent='연결이 끊겼어요. 새로고침 후 다시 입장해 주세요.'})},18000);setInterval(()=>{if(music&&ready&&!music.paused)syncMusic(music)},15000);window.addEventListener('pagehide',()=>{if(id)navigator.sendBeacon('/api/leave',new Blob([JSON.stringify({id,pageId})],{type:'application/json'}))});
</script></body></html>
