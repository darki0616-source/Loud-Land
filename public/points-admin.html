<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONEseason 포인트 관리</title><style>
*{box-sizing:border-box}body{margin:0;background:#09172b;color:#e8f6ff;font:15px/1.5 system-ui,sans-serif}main{max-width:680px;margin:0 auto;padding:24px 16px 70px}h1{font-size:24px;margin:0 0 6px}p{color:#a7c6d8}.card{background:#102b45;border:1px solid #285876;border-radius:17px;padding:18px;margin-top:14px}label{display:block;font-weight:700;margin:12px 0 5px}input{width:100%;background:#081d31;border:1px solid #4485a2;color:white;border-radius:10px;padding:12px;font-size:16px}button{border:0;border-radius:10px;padding:11px 16px;background:#64dbc7;color:#072d40;font-size:15px;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.row{display:flex;gap:10px;align-items:end}.row>div{flex:1}.row button{white-space:nowrap}#msg{min-height:24px;color:#ffe0a0}.balance{font-size:25px;font-weight:800;color:#8df5db}.history{padding-left:20px;line-height:1.7}.muted{font-size:13px;color:#a7c6d8}[hidden]{display:none}
</style></head><body><main><h1>🪙 포인트 관리</h1><p>복구 코드로 유저를 찾고 포인트를 지급합니다.</p><section class="card"><label for="adminKey">관리자 키</label><input id="adminKey" type="password" autocomplete="off" placeholder="기존 관리자 키"><label for="code">유저 복구 코드</label><div class="row"><div><input id="code" type="password" autocomplete="off" autocapitalize="none" placeholder="OS-로 시작하는 복구 코드"></div><button id="lookup" type="button">유저 찾기</button></div><p class="muted">복구 코드는 계정의 비밀번호와 같습니다. 유저에게 받은 코드를 안전하게 관리하세요.</p></section><section class="card" id="account" hidden><div id="name"></div><div id="balance" class="balance"></div><label for="amount">지급할 포인트</label><input id="amount" type="number" min="1" max="1000000" step="1" inputmode="numeric" placeholder="예: 8700"><label for="reason">지급 사유</label><input id="reason" maxlength="100" placeholder="예: 이벤트 보상"><p><button id="grant" type="button">포인트 지급</button></p><p class="muted">관리자 지급 내역</p><ul class="history" id="history"></ul></section><p id="msg" role="status"></p></main><script>
'use strict';const $=id=>document.getElementById(id);let selectedCode='',selectedKey='',pending=null;function msg(t){$('msg').textContent=t}function render(d){$('name').textContent='👤 '+(d.name||$('name').textContent.replace('👤 ',''));$('balance').textContent=Number(d.points||0).toLocaleString()+'P';$('history').replaceChildren();for(const h of d.history||[]){const li=document.createElement('li');li.textContent=new Date(h.at).toLocaleString('ko-KR')+' · +'+Number(h.amount).toLocaleString()+'P'+(h.reason?' · '+h.reason:'');$('history').append(li)}if(!(d.history||[]).length){const li=document.createElement('li');li.textContent='지급 내역이 없습니다.';$('history').append(li)}}async function api(key,body){const r=await fetch('/api/points-admin',{method:'POST',headers:{'content-type':'application/json','x-md-admin-key':key},body:JSON.stringify(body),cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'서버 오류');return d}
$('lookup').onclick=async()=>{const code=$('code').value.trim(),key=$('adminKey').value;if(!code||!key)return msg('관리자 키와 복구 코드를 입력해 주세요.');$('lookup').disabled=true;msg('조회 중…');try{const r=await api(key,{command:'lookup',code});selectedCode=code;selectedKey=key;pending=null;$('account').hidden=false;render(r);msg('유저를 확인했어요.')}catch(e){$('account').hidden=true;msg(e.message)}finally{$('lookup').disabled=false}};
$('grant').onclick=async()=>{const amount=Number($('amount').value),reason=$('reason').value.trim();if(!selectedCode||$('code').value.trim()!==selectedCode||$('adminKey').value!==selectedKey){$('account').hidden=true;return msg('코드 또는 키가 바뀌었어요. 유저를 다시 찾아주세요.')}if(!Number.isSafeInteger(amount)||amount<1||amount>1000000)return msg('1~1,000,000P를 정수로 입력해 주세요.');if(pending&&(pending.amount!==amount||pending.reason!==reason))return msg('이전 지급 결과를 먼저 같은 값으로 다시 확인해 주세요.');if(!pending){if(!confirm(`${$('name').textContent}에게 ${amount.toLocaleString()}P를 지급할까요?`))return;pending={amount,reason,requestId:crypto.randomUUID()}}$('grant').disabled=true;msg('지급 처리 중…');try{const r=await api(selectedKey,{command:'grant',code:selectedCode,...pending});render(r);msg(r.duplicate?'이전에 처리된 지급을 확인했어요.':'지급했어요.');pending=null;$('amount').value='';$('reason').value=''}catch(e){msg(e.message+' 같은 값으로 지급을 다시 누르면 중복 없이 확인해요.')}finally{$('grant').disabled=false}};
</script></body></html>
